server {
    listen 80;
    root /usr/share/nginx/html;

    # Same-origin API (spec F-1): /api/x -> http://app:8000/x
    location /api/ {
        proxy_pass http://app:8000/;
        proxy_set_header Host $host;
    }

    # Client-side routes fall back to the SPA.
    location / {
        try_files $uri /index.html;
    }
}
