server {
    listen 80;
    root /usr/share/nginx/html;

    # Same-origin API (spec F-1): /api/x -> http://app:8000/x
    # "app" is resolved once at nginx start, so recreating the app container needs a
    # frontend restart (acceptable for a demo).
    location /api/ {
        proxy_pass http://app:8000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The assistant, gRPC-Web through Envoy (spec D-30). Unbuffered: a chat turn streams.
    location /smarthealth.assistant.v1.Assistant/ {
        proxy_pass http://envoy:8088;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $http_host;
    }

    # A missing hashed asset is a 404, not index.html served as JavaScript.
    location /assets/ {
        try_files $uri =404;
    }

    # Client-side routes fall back to the SPA.
    location / {
        try_files $uri /index.html;
    }
}
