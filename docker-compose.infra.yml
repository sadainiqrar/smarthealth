# The single infrastructure topology. The dev stack and the test stack are the same
# services under different compose project names, so there is never a second
# definition to drift.
#
#   dev:   docker compose -f docker-compose.infra.yml up -d --wait
#   test:  docker compose -p smarthealth-test --env-file .env.test -f docker-compose.infra.yml up -d --wait
#   full:  docker compose --profile app -f docker-compose.infra.yml up -d --wait
#
# The `full` invocation adds the containerised application. It is deliberately behind
# a profile, so the two infrastructure-only invocations above are unchanged by it.
#
# Every service declares a healthcheck: `--wait` blocks until they report healthy,
# so the harness never sleeps and guesses.

name: smarthealth

services:
  app:
    # Behind a profile so the test stack, which runs this same file under
    # -p smarthealth-test, does not try to start an app container on every
    # `up -d --wait`. The tests drive the application in-process.
    #
    #   docker compose --profile app -f docker-compose.infra.yml up -d --wait
    #
    # Note this reaches the databases on their *internal* ports. The 15432/27018
    # offsets in .env.test are host-side publications only and mean nothing here.
    profiles: ["app"]
    build: .
    environment:
      SMARTHEALTH_ENVIRONMENT: docker
      SMARTHEALTH_POSTGRES_HOST: postgres
      SMARTHEALTH_POSTGRES_PORT: 5432
      SMARTHEALTH_POSTGRES_USER: ${POSTGRES_USER:-smarthealth}
      SMARTHEALTH_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smarthealth}
      SMARTHEALTH_POSTGRES_DB: ${POSTGRES_DB:-smarthealth}
      SMARTHEALTH_MONGO_HOST: mongo
      SMARTHEALTH_MONGO_PORT: 27017
      SMARTHEALTH_MONGO_DB: ${MONGO_DB:-smarthealth}
      SMARTHEALTH_REDIS_HOST: redis
      SMARTHEALTH_REDIS_PORT: 6379
      SMARTHEALTH_TEMPORAL_HOST: temporal
      SMARTHEALTH_TEMPORAL_PORT: 7233
      SMARTHEALTH_OTEL_ENDPOINT_HTTP: http://otel-collector:4318
      SMARTHEALTH_OTEL_ENDPOINT_GRPC: http://otel-collector:4317
      # Unset, the development signing key is used -- fine for this compose stack, and
      # refused by the app when SMARTHEALTH_ENVIRONMENT=production.
      SMARTHEALTH_JWT_PRIVATE_KEY: ${SMARTHEALTH_JWT_PRIVATE_KEY:-}
      SMARTHEALTH_DOCUMENTS_PATH: /var/smarthealth/documents
      SMARTHEALTH_RABBITMQ_HOST: rabbitmq
    ports: ["${APP_PORT:-8000}:8000"]
    # Uploaded reports (spec 9.6), shared with the Celery worker that extracts their text.
    volumes: ["part-a-documents:/var/smarthealth/documents"]
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    # The Temporal worker: same image as the API, different process (PRD R-8 -- the
    # two scale independently). Waits for `app` to be healthy because the app
    # container applies migrations, and an activity must never meet an unmigrated
    # schema.
    profiles: ["app"]
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      SMARTHEALTH_ENVIRONMENT: docker
      SMARTHEALTH_POSTGRES_HOST: postgres
      SMARTHEALTH_POSTGRES_PORT: 5432
      SMARTHEALTH_POSTGRES_USER: ${POSTGRES_USER:-smarthealth}
      SMARTHEALTH_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smarthealth}
      SMARTHEALTH_POSTGRES_DB: ${POSTGRES_DB:-smarthealth}
      SMARTHEALTH_MONGO_HOST: mongo
      SMARTHEALTH_MONGO_PORT: 27017
      SMARTHEALTH_MONGO_DB: ${MONGO_DB:-smarthealth}
      SMARTHEALTH_TEMPORAL_HOST: temporal
      SMARTHEALTH_TEMPORAL_PORT: 7233
      SMARTHEALTH_OTEL_ENDPOINT_HTTP: http://otel-collector:4318
      SMARTHEALTH_OTEL_ENDPOINT_GRPC: http://otel-collector:4317
      # The worker owns the no-show timer, so it is the process that reads the grace.
      SMARTHEALTH_NO_SHOW_GRACE_MINUTES: ${NO_SHOW_GRACE_MINUTES:-15}
      # Billing activities call the payment gateway (spec D-27).
      SMARTHEALTH_PAYMENTS_URL: http://payments-mock:8090
    depends_on:
      app:
        condition: service_healthy
      temporal:
        condition: service_healthy
    # Must exceed GRACEFUL_SHUTDOWN (8 s, app/core/temporal.py) so in-flight activities
    # drain before docker SIGKILLs the container.
    stop_grace_period: 15s
    healthcheck:
      # Executes the canary workflow: proves a worker is polling AND executing, which
      # "the process is up" does not. Each check leaves one tiny closed workflow in
      # Temporal's history; at this interval that is negligible. `--check` bounds
      # itself to 8 s, so this timeout sits above it with room for interpreter start-up.
      test: ["CMD", "python", "-m", "app.worker", "--check"]
      interval: 15s
      timeout: 12s
      retries: 8

  relay:
    # The outbox relay (spec D-21): publishes outbox rows to Kafka. Creates the topics and
    # registers the schemas at start-up, so a schema that breaks compatibility stops the
    # deploy here. Waits for `app`, which applies the migrations.
    profiles: ["app"]
    build: .
    command: ["python", "-m", "app.relay"]
    environment:
      SMARTHEALTH_ENVIRONMENT: docker
      SMARTHEALTH_POSTGRES_HOST: postgres
      SMARTHEALTH_POSTGRES_PORT: 5432
      SMARTHEALTH_POSTGRES_USER: ${POSTGRES_USER:-smarthealth}
      SMARTHEALTH_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smarthealth}
      SMARTHEALTH_POSTGRES_DB: ${POSTGRES_DB:-smarthealth}
      SMARTHEALTH_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SMARTHEALTH_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SMARTHEALTH_OTEL_ENDPOINT_HTTP: http://otel-collector:4318
    depends_on:
      app:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    stop_grace_period: 15s

  consumers:
    # The Kafka consumers (python -m app.consumers): domain events that start the workflows
    # following them -- the cancel follow-up, provider deactivation, the post-visit charge
    # (spec D-20). Its own process, so an event backlog never competes with requests.
    profiles: ["app"]
    build: .
    command: ["python", "-m", "app.consumers"]
    environment:
      SMARTHEALTH_ENVIRONMENT: docker
      SMARTHEALTH_POSTGRES_HOST: postgres
      SMARTHEALTH_POSTGRES_PORT: 5432
      SMARTHEALTH_POSTGRES_USER: ${POSTGRES_USER:-smarthealth}
      SMARTHEALTH_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smarthealth}
      SMARTHEALTH_POSTGRES_DB: ${POSTGRES_DB:-smarthealth}
      SMARTHEALTH_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SMARTHEALTH_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SMARTHEALTH_TEMPORAL_HOST: temporal
      SMARTHEALTH_TEMPORAL_PORT: 7233
      SMARTHEALTH_OTEL_ENDPOINT_HTTP: http://otel-collector:4318
    depends_on:
      relay:
        condition: service_started
      temporal:
        condition: service_healthy
    stop_grace_period: 15s

  celery-worker:
    # Fire-and-forget jobs (spec section 5): notification delivery and the maintenance
    # sweeps. Not the dead-letter queue: that one is kept for people to inspect.
    profiles: ["app"]
    build: .
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=INFO",
              "-Q", "notifications,maintenance,documents", "--concurrency=2"]
    volumes: ["part-a-documents:/var/smarthealth/documents"]
    environment:
      SMARTHEALTH_ENVIRONMENT: docker
      SMARTHEALTH_POSTGRES_HOST: postgres
      SMARTHEALTH_POSTGRES_PORT: 5432
      SMARTHEALTH_POSTGRES_USER: ${POSTGRES_USER:-smarthealth}
      SMARTHEALTH_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smarthealth}
      SMARTHEALTH_POSTGRES_DB: ${POSTGRES_DB:-smarthealth}
      SMARTHEALTH_MONGO_HOST: mongo
      SMARTHEALTH_MONGO_PORT: 27017
      SMARTHEALTH_MONGO_DB: ${MONGO_DB:-smarthealth}
      SMARTHEALTH_REDIS_HOST: redis
      SMARTHEALTH_REDIS_PORT: 6379
      SMARTHEALTH_RABBITMQ_HOST: rabbitmq
      SMARTHEALTH_RABBITMQ_PORT: 5672
      SMARTHEALTH_RABBITMQ_USER: ${RABBITMQ_USER:-smarthealth}
      SMARTHEALTH_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-smarthealth}
      SMARTHEALTH_SMTP_HOST: mailpit
      SMARTHEALTH_DOCUMENTS_PATH: /var/smarthealth/documents
      SMARTHEALTH_SMTP_PORT: 1025
      SMARTHEALTH_TEMPORAL_HOST: temporal
      SMARTHEALTH_TEMPORAL_PORT: 7233
      SMARTHEALTH_PAYMENTS_URL: http://payments-mock:8090
      SMARTHEALTH_OTEL_ENDPOINT_HTTP: http://otel-collector:4318
    depends_on:
      app:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    stop_grace_period: 15s

  celery-beat:
    # The schedule: requeue stuck notifications (1 min), reconcile orphaned pending
    # bookings (5 min, PRD R-9), purge published outbox rows (daily). One instance only.
    profiles: ["app"]
    build: .
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=INFO",
              "--schedule=/tmp/celerybeat-schedule"]
    environment:
      SMARTHEALTH_ENVIRONMENT: docker
      SMARTHEALTH_POSTGRES_HOST: postgres
      SMARTHEALTH_POSTGRES_PORT: 5432
      SMARTHEALTH_POSTGRES_USER: ${POSTGRES_USER:-smarthealth}
      SMARTHEALTH_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smarthealth}
      SMARTHEALTH_POSTGRES_DB: ${POSTGRES_DB:-smarthealth}
      SMARTHEALTH_MONGO_HOST: mongo
      SMARTHEALTH_MONGO_PORT: 27017
      SMARTHEALTH_MONGO_DB: ${MONGO_DB:-smarthealth}
      SMARTHEALTH_REDIS_HOST: redis
      SMARTHEALTH_REDIS_PORT: 6379
      SMARTHEALTH_RABBITMQ_HOST: rabbitmq
      SMARTHEALTH_RABBITMQ_PORT: 5672
      SMARTHEALTH_RABBITMQ_USER: ${RABBITMQ_USER:-smarthealth}
      SMARTHEALTH_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-smarthealth}
      SMARTHEALTH_SMTP_HOST: mailpit
      SMARTHEALTH_DOCUMENTS_PATH: /var/smarthealth/documents
      SMARTHEALTH_SMTP_PORT: 1025
      SMARTHEALTH_TEMPORAL_HOST: temporal
      SMARTHEALTH_TEMPORAL_PORT: 7233
      SMARTHEALTH_PAYMENTS_URL: http://payments-mock:8090
      SMARTHEALTH_OTEL_ENDPOINT_HTTP: http://otel-collector:4318
    depends_on:
      rabbitmq:
        condition: service_healthy

  # --- Part B (Week 3 slice 7: skeletons; spec section 1) -------------------------------
  # Two services, each with its own stores and nothing of Part A's: they share Kafka,
  # Schema Registry, Envoy and the observability stack, and reach Part A only through its
  # public HTTP API (JWKS) and its events (spec D-19).
  #
  #   docker compose --profile app --profile partb -f docker-compose.infra.yml up -d --wait

  knowledge:
    profiles: ["partb"]
    build: { context: ., dockerfile: services/knowledge/Dockerfile }
    environment:
      KNOWLEDGE_ENVIRONMENT: docker
      KNOWLEDGE_DATABASE_URL: postgresql+asyncpg://knowledge:knowledge@knowledge-db:5432/knowledge
      KNOWLEDGE_QDRANT_URL: http://qdrant:6333
      # Real embeddings in the running system; tests replay the recorded ones (fixture).
      KNOWLEDGE_EMBEDDING_MODE: live
      FASTEMBED_CACHE_PATH: /models
      KNOWLEDGE_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KNOWLEDGE_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KNOWLEDGE_JWKS_URL: http://app:8000/.well-known/jwks.json
      KNOWLEDGE_OTEL_ENDPOINT_HTTP: http://otel-collector:4318
    volumes: ["knowledge-models:/models"]
    depends_on:
      knowledge-db: { condition: service_healthy }
      qdrant: { condition: service_started }
      kafka: { condition: service_healthy }

  knowledge-db:
    # The knowledge service's own database -- never Part A's (spec D-19).
    profiles: ["partb"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
      POSTGRES_DB: knowledge
    volumes: ["knowledge-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 5s
      timeout: 3s
      retries: 12

  qdrant:
    # The vector database (Week 4): up, and part of the knowledge service's readiness, now.
    profiles: ["partb"]
    image: qdrant/qdrant:v1.12.4
    ports: ["${QDRANT_PORT:-6333}:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]

  assistant:
    profiles: ["partb"]
    build: { context: ., dockerfile: services/assistant/Dockerfile }
    environment:
      ASSISTANT_ENVIRONMENT: docker
      ASSISTANT_REDIS_URL: redis://assistant-redis:6379/0
      ASSISTANT_KNOWLEDGE_TARGET: knowledge:50052
      ASSISTANT_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ASSISTANT_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      ASSISTANT_JWKS_URL: http://app:8000/.well-known/jwks.json
      ASSISTANT_OTEL_ENDPOINT_HTTP: http://otel-collector:4318
    depends_on:
      assistant-redis: { condition: service_healthy }
      knowledge: { condition: service_healthy }

  assistant-redis:
    # The assistant's own Redis: turn streams, the revoked-session deny-list (spec 4.4).
    profiles: ["partb"]
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  envoy:
    # The single front door (spec D-30): gRPC-Web for the browser, /api/* to Part A.
    profiles: ["partb"]
    image: envoyproxy/envoy:v1.31.2
    volumes: ["./ops/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro"]
    ports: ["${ENVOY_PORT:-8088}:8088"]
    depends_on: [assistant, knowledge]

  temporal-ui:
    # Temporal's web UI: every workflow's history and state (booking-<id>, visit-<id>,
    # cancel-<id>, reschedule-<id>) at http://localhost:8080. Read-only use; nothing in the
    # application depends on it.
    profiles: ["app"]
    image: temporalio/ui:2.31.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports: ["${TEMPORAL_UI_PORT:-8080}:8080"]
    depends_on:
      temporal:
        condition: service_healthy

  frontend:
    # The demo client: nginx serving the built SPA and proxying /api to `app`.
    profiles: ["app"]
    build: ./frontend
    ports: ["${FRONTEND_PORT:-5173}:80"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # busybox wget ships in nginx:alpine; 127.0.0.1 because localhost may resolve to ::1.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smarthealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smarthealth}
      POSTGRES_DB: ${POSTGRES_DB:-smarthealth}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smarthealth}"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongo:
    image: mongo:7
    ports: ["${MONGO_PORT:-27017}:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    # The STATE instance (Weeks 3-5 spec D-24): sessions, rate-limit counters, locks.
    # noeviction, because evicting a session under memory pressure logs a user out at
    # random and evicting a throttle counter unlocks a guesser; full memory should fail
    # writes loudly instead. AOF so a restart does not log everyone out. Caches get their
    # own instance (allkeys-lru) when the first cache lands (slice 5).
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-smarthealth}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-smarthealth}
      # Part A's own vhost (spec D-19); the Part B services get theirs.
      RABBITMQ_DEFAULT_VHOST: part-a
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    environment:
      # KRaft mode — single node, no ZooKeeper.
      CLUSTER_ID: smarthealth-kraft-cluster
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Off (Weeks 3-5 spec section 3.2): compaction and partitions must be declared, and
      # a misspelt topic must fail loudly. `python -m app.relay --setup` creates them.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["${KAFKA_PORT:-9092}:9092"]
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 10s
      retries: 18

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports: ["${SCHEMA_REGISTRY_PORT:-8081}:8081"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 18

  mailpit:
    # A local SMTP server with a web inbox (http://localhost:8025): the email channel
    # delivers here, so a demo shows real messages arrive. Not behind a profile: the
    # integration tier reads its API to prove delivery.
    image: axllent/mailpit:v1.20.0
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"

  payments-mock:
    # A fake payment gateway standing in for an external provider (spec D-27): honours
    # Idempotency-Key, misbehaves on request (POST /_chaos). It belongs to no service and
    # shares no store; Part A reaches it over HTTP only. Not behind a profile: bookings
    # in the integration tier call it.
    build: ./services/payments_mock
    ports: ["${PAYMENTS_PORT:-8090}:8090"]

  # --- Observability (Week 3 slice 1; Weeks 3-5 spec section 7) -----------------------
  # Not behind a profile: the test stack runs them too, so the docker lane can prove a
  # span and a metric really cross the collector (test_telemetry_pipeline.py).

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    volumes:
      - ./ops/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    depends_on: [jaeger]
    # Distroless image: no shell, so no in-container healthcheck. Compose's --wait then
    # waits for "running"; the pipeline test polls for real delivery instead.

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["${JAEGER_UI_PORT:-16686}:16686"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka-exporter:
    # Consumer lag and topic offsets for Prometheus; Kafka exposes neither itself.
    image: danielqsj/kafka-exporter:v1.8.0
    command: ["--kafka.server=kafka:29092"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-smarthealth}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${POSTGRES_USER:-smarthealth}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-smarthealth}
    ports: ["${TEMPORAL_PORT:-7233}:7233"]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 10s
      retries: 18

volumes:
  postgres-data:
  part-a-documents:
  knowledge-data:
  qdrant-data:
  knowledge-models:
  mongo-data:
  kafka-data:
