# Templated, not copied from ops/: under Kubernetes Jaeger serves under /jaeger.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |-
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
      - name: Analytics
        uid: analytics
        type: grafana-postgresql-datasource
        url: postgres:5432
        user: analytics_reader
        secureJsonData:
          password: analytics-reader
        jsonData:
          database: smarthealth
          sslmode: disable
          postgresVersion: 1600
        editable: false
      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686/jaeger
        editable: false
