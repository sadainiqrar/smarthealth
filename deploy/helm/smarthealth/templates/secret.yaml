# deploy/helm/smarthealth/templates/secret.yaml
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.secretName }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
# The tool login. Traefik 2.x accepts a basicAuth Secret only when it holds exactly one key,
# so the htpasswd line cannot live in the shared Secret: it gets its own, key `users`.
# bcrypt salts afresh on every render, so a computed line changes each upgrade (k3d only;
# a precomputed toolsAuth.htpasswd keeps it stable).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.toolsAuth.secretName }}
type: Opaque
stringData:
  users: {{ .Values.toolsAuth.htpasswd | default (htpasswd .Values.toolsAuth.user .Values.toolsAuth.password) | quote }}
{{- end }}
