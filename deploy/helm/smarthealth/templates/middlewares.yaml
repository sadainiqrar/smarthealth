# Traefik (bundled with k3s/k3d) middlewares used by the ingresses.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tools-auth
spec:
  basicAuth:
    # A one-key Secret (`users`; Traefik 2.x refuses a Secret with more keys), rendered by
    # secrets.yaml or created beside smarthealth-secrets (spec section 5). No `lookup`, so
    # `helm template` (Argo CD) renders the same as `helm install`.
    secret: {{ .Values.toolsAuth.secretName }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api
spec:
  stripPrefix:
    prefixes: ["/api"]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-prometheus
spec:
  stripPrefix:
    prefixes: ["/prometheus"]
