# The shared Secret (spec section 5). create=true renders it from `secrets.values`
# (k3d: public development defaults). create=false (AWS) expects it to exist already.
secrets:
  create: false
  values: {}

# One login in front of the tool UIs (Traefik basic-auth), read from the one-key Secret
# `secretName` (key `users`, an htpasswd line; Traefik 2.x refuses a Secret with more keys).
# With secrets.create the chart renders it: `htpasswd` if set, else computed from
# user/password (a fresh bcrypt salt each render, so it changes every upgrade -- acceptable
# on k3d). With secrets.create=false it must exist, created beside smarthealth-secrets.
toolsAuth:
  secretName: smarthealth-tools-auth
  user: reviewer
  password: ""
  htpasswd: ""        # a precomputed `user:$2y$...` line; "" = compute it

# The optional demo data Job (docs/superpowers/specs/2026-11-16-demo-seed-data-design.md).
demoSeed:
  enabled: false
  mode: seed          # seed | refresh
  timezone: Australia/Sydney
  # Bump to re-run: Job specs are immutable, so each run gets a new name.
  run: "1"
