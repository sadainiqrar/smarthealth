# The slim profile: everything on one 8 GB node (m7i-flex.large). Per-workload memory
# limits live here, under each component, so the whole budget reads in one file. Requests are
# roughly the working set measured on k3d after the demo seed (`kubectl top`); limits ~1.5x it,
# at least +64Mi, more where a peak or a cache demands it.
global:
  # Where the system is reached from a browser; sub-path tools build links from it.
  publicUrl: http://localhost:8080
  # The one Secret every chart reads credentials from (spec section 5).
  secretName: smarthealth-secrets
  image:
    registry: ""       # "" = images imported into the cluster (k3d); ghcr.io/<owner> on AWS
    tag: dev
    pullPolicy: IfNotPresent
  # Names of image pull Secrets for every pod (e.g. a private registry); empty on k3d.
  imagePullSecrets: []

