global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Everything the application emits, via the collector's Prometheus exporter.
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
