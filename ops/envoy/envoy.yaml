# The single front door (spec D-30). The browser speaks gRPC-Web, which Envoy translates to
# native gRPC for the Part B services; /api/* goes to Part A's HTTP API. Between services
# (assistant -> knowledge) calls are native gRPC with no Envoy in between.
static_resources:
  listeners:
    - name: edge
      address: { socket_address: { address: 0.0.0.0, port_value: 8088 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: edge
                codec_type: AUTO
                route_config:
                  name: routes
                  virtual_hosts:
                    - name: smarthealth
                      domains: ["*"]
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match: [{ prefix: "http://localhost" }]
                          allow_methods: "GET, POST, PATCH, OPTIONS"
                          allow_headers: "authorization, content-type, x-grpc-web, x-user-agent, grpc-timeout, idempotency-key"
                          expose_headers: "grpc-status, grpc-message"
                      routes:
                        - match: { prefix: "/smarthealth.assistant.v1.Assistant/" }
                          route: { cluster: assistant, timeout: 0s, max_stream_duration: { grpc_timeout_header_max: 0s } }
                        - match: { prefix: "/smarthealth.knowledge.v1.Knowledge/" }
                          route: { cluster: knowledge, timeout: 10s }
                        - match: { prefix: "/api/" }
                          route: { cluster: part_a, prefix_rewrite: "/" }
                http_filters:
                  - name: envoy.filters.http.grpc_web
                    typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb }
                  - name: envoy.filters.http.cors
                    typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors }
                  - name: envoy.filters.http.router
                    typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
  clusters:
    - name: assistant
      type: STRICT_DNS
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: { http2_protocol_options: {} }
      load_assignment:
        cluster_name: assistant
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: assistant, port_value: 50051 } } } }] }]
    - name: knowledge
      type: STRICT_DNS
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: { http2_protocol_options: {} }
      load_assignment:
        cluster_name: knowledge
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: knowledge, port_value: 50052 } } } }] }]
    - name: part_a
      type: STRICT_DNS
      load_assignment:
        cluster_name: part_a
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: app, port_value: 8000 } } } }] }]
admin:
  address: { socket_address: { address: 0.0.0.0, port_value: 9901 } }
