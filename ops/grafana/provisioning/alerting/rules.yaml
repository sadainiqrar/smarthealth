{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "smarthealth-part-a",
      "folder": "SmartHealth",
      "interval": "1m",
      "rules": [
        {
          "uid": "outbox-backlog",
          "title": "Outbox backlog older than a minute",
          "condition": "C",
          "for": "2m",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "Events are not reaching Kafka: is the relay running, is Kafka up?"
          },
          "labels": {
            "service": "part-a"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "max(smarthealth_outbox_oldest_unpublished_age_seconds)",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        60
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "dead-letters",
          "title": "An event was dead-lettered",
          "condition": "C",
          "for": "0s",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "A consumer gave up on an event; fix the cause, then dlt-replay."
          },
          "labels": {
            "service": "part-a"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "sum(increase(smarthealth_consumer_events_total{outcome=\"dead_lettered\"}[10m]))",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "notification-dlq",
          "title": "Notifications in the dead-letter queue",
          "condition": "C",
          "for": "0s",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "A patient message failed for good."
          },
          "labels": {
            "service": "part-a"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "sum(rabbitmq_queue_messages_ready{queue=~\".*notifications.dlq\"})",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "consumer-lag",
          "title": "A consumer is falling behind",
          "condition": "C",
          "for": "10m",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "Consumer lag has stayed above 1000 for ten minutes."
          },
          "labels": {
            "service": "part-a"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "max(kafka_consumergroup_lag)",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        1000
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "api-errors",
          "title": "API 5xx above 5%",
          "condition": "C",
          "for": "5m",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "More than one request in twenty is failing on the server."
          },
          "labels": {
            "service": "part-a"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "sum(rate(http_server_duration_milliseconds_count{job=\"smarthealth/part-a-api\",http_status_code=~\"5..\"}[5m])) / clamp_min(sum(rate(http_server_duration_milliseconds_count{job=\"smarthealth/part-a-api\"}[5m])), 1e-9)",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0.05
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "booking-failures",
          "title": "Booking workflows failing",
          "condition": "C",
          "for": "0s",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "More than five bookings failed in fifteen minutes."
          },
          "labels": {
            "service": "part-a"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "sum(increase(temporal_workflow_failed_total{workflow_type=\"BookAppointment\"}[15m]))",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        5
                      ]
                    }
                  }
                ]
              }
            }
          ]
        }
      ]
    }
  ]
}
