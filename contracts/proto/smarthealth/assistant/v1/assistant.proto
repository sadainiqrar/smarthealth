// The assistant service (Part B, Week 5): conversations, streamed to the browser over
// gRPC-Web through Envoy (spec D-30). Server-streaming only -- the shape gRPC-Web supports,
// and the shape of a chat turn.
//
// A turn is free text *or* a structured answer to something the assistant offered:
// a choice from an Options list, or a decision on a ConfirmationRequired. The assistant
// answers with a stream that mixes prose (token) with interactive parts the client renders
// as controls -- choices, confirmation cards, result cards, follow-up suggestions -- so a
// use case can be driven by clicks, by typing, or by both.
//
// Compatibility: fields are only ever added (buf breaking, spec 9.3). Week 3's echo
// clients still work: they ignore the kinds they do not know.
syntax = "proto3";

package smarthealth.assistant.v1;

service Assistant {
  // One turn: the user's input in, a stream of events out. A reconnect sends the same
  // turn_id with resume_from = the last seq it saw, and the stream replays after it.
  rpc Chat(ChatRequest) returns (stream ChatEvent);
  // Answers a ConfirmationRequired and resumes the paused turn. Its events continue the
  // same conversation under the new turn_id the client chose.
  rpc Confirm(ConfirmRequest) returns (stream ChatEvent);
  // "Stop generating": the browser cannot send on an open server stream, so this is a
  // separate call. The turn's stream ends with Done.
  rpc Cancel(CancelRequest) returns (CancelReply);
  // What this caller can start with: use cases for their role, grouped. The server picks
  // them from the token's role; the client never sends a role.
  rpc Starters(StartersRequest) returns (StartersReply);
  // The caller's conversations, most recent first, and one conversation's transcript, so
  // a user keeps many threads and a reload reopens them. Scoped to the caller's user id
  // on the server: no request names whose conversations to read.
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsReply);
  rpc GetConversation(GetConversationRequest) returns (ConversationReply);
  rpc DeleteConversation(DeleteConversationRequest) returns (DeleteConversationReply);
  // LLM usage per user over a date range -- admin only (PERMISSION_DENIED otherwise).
  // Users are ids and roles: the admin's browser joins names and emails from Part A's
  // GET /users, so this service never holds Part A's user data.
  rpc Usage(UsageRequest) returns (UsageReply);
  // Long reports (PART-B-FR-4), admin only: StartReport answers at once with a job; the
  // report is written in the background, and WatchReport streams it -- replaying what is
  // written so far, then following until Done. Watch again (or resume_from) any time.
  rpc StartReport(StartReportRequest) returns (ReportJob);
  rpc WatchReport(WatchReportRequest) returns (stream ChatEvent);
  rpc ListReports(ListReportsRequest) returns (ListReportsReply);
}

message ChatRequest {
  string conversation_id = 1;
  // Chosen by the client, so a retry and a resume name the same turn.
  string turn_id = 2;
  string message = 3;
  // Replay only events with seq greater than this (0: from the start).
  int64 resume_from = 4;
  // Set instead of (or with) message when the user picked from an Options list.
  OptionChoice choice = 5;
  // Set when the user started from a Starter: begins that use case's flow directly.
  string starter_id = 6;
}

message OptionChoice {
  string options_id = 1;
  string option_id = 2;
}

message ChatEvent {
  string turn_id = 1;
  // Strictly increasing within a turn, from 1.
  int64 seq = 2;
  oneof kind {
    string token = 3;
    Citation citation = 4;
    Done done = 5;
    Error error = 6;
    ToolActivity tool = 7;
    Options options = 8;
    ConfirmationRequired confirmation = 9;
    Card card = 10;
    Suggestions suggestions = 11;
  }
}

message Citation {
  string source_id = 1;
  string title = 2;
  string snippet = 3;
}

message Done {
  // "complete", "cancelled", or "awaiting_input" (the turn paused on Options or a
  // ConfirmationRequired; the conversation continues with the user's answer).
  string reason = 1;
}

message Error {
  string code = 1;
  string message = 2;
}

// A step the assistant took on the user's behalf: a lookup in Part A, a search in
// knowledge. Sent twice per call -- running, then done or failed -- under one call_id.
message ToolActivity {
  string call_id = 1;
  string name = 2;
  // Human words: "Looking up free cardiology slots".
  string label = 3;
  // "running" | "done" | "failed"
  string status = 4;
  string summary = 5;
}

// A choice the user answers with a click (or by typing). The turn ends awaiting input.
message Options {
  string options_id = 1;
  string prompt = 2;
  repeated Option options = 3;
  // How the client should lay them out: "list" (rich rows) or "chips" (short labels).
  string style = 4;
}

message Option {
  string id = 1;
  string label = 2;
  string description = 3;
  // Optional small tag: "Earliest", "Same doctor as last time".
  string badge = 4;
}

// A write the assistant will make only with the user's yes (spec 9.2): booking, cancel,
// reschedule, waitlist, sending a message. Nothing has happened yet when this is sent.
message ConfirmationRequired {
  string confirmation_id = 1;
  // "book_appointment", "cancel_appointment", ...
  string action = 2;
  string title = 3;
  repeated Field details = 4;
  string confirm_label = 5;
  string deny_label = 6;
  // "normal" | "destructive" -- a cancel is styled differently from a booking.
  string tone = 7;
}

// A structured result: an appointment, a slot, a prescription, a test order.
message Card {
  string kind = 1;
  string title = 2;
  string subtitle = 3;
  repeated Field fields = 4;
  string badge = 5;
  // Where the demo client can show the record (e.g. "/bookings/<id>"); may be empty.
  string link = 6;
}

message Field {
  string label = 1;
  string value = 2;
}

// Follow-ups offered at the end of a turn; clicking one sends it as the next message.
message Suggestions {
  repeated string items = 1;
}

message ConfirmRequest {
  string conversation_id = 1;
  // The new turn the decision starts (chosen by the client, like ChatRequest.turn_id).
  string turn_id = 2;
  string confirmation_id = 3;
  bool approved = 4;
  int64 resume_from = 5;
}

message CancelRequest {
  string turn_id = 1;
}

message CancelReply {
  bool cancelled = 1;
}

message StartersRequest {}

message StartersReply {
  repeated StarterGroup groups = 1;
}

message StarterGroup {
  string title = 1;
  repeated Starter starters = 2;
}

message Starter {
  string id = 1;
  string title = 2;
  string description = 3;
  // A lucide icon name the client maps to a glyph ("calendar-plus", "pill", ...).
  string icon = 4;
  // "flow": a guided, click-driven use case; "prompt": sends `prompt` as a chat message.
  string mode = 5;
  string prompt = 6;
}

message ListConversationsRequest {
  int32 limit = 1;
}

message ConversationSummary {
  string conversation_id = 1;
  string title = 2;
  // RFC 3339.
  string updated_at = 3;
  int32 turns = 4;
  // The thread ended on a question the user has not answered yet.
  bool awaiting_input = 5;
}

message ListConversationsReply {
  repeated ConversationSummary conversations = 1;
}

message GetConversationRequest {
  string conversation_id = 1;
}

// One recorded turn: what the user said or picked ("[approved]" / "[declined]" for a
// confirmation decision) and
// every event the assistant streamed, in seq order -- the client folds them as it did live.
message TranscriptTurn {
  string turn_id = 1;
  string user_text = 2;
  repeated ChatEvent events = 3;
}

message ConversationReply {
  string conversation_id = 1;
  string title = 2;
  repeated TranscriptTurn turns = 3;
}

message DeleteConversationRequest {
  string conversation_id = 1;
}

message DeleteConversationReply {
  bool deleted = 1;
}

message UsageRequest {
  // Inclusive dates, YYYY-MM-DD (UTC). Empty: the last seven days.
  string from_date = 1;
  string to_date = 2;
}

message UserUsage {
  string user_id = 1;
  string role = 2;
  int32 conversations = 3;
  int32 turns = 4;
  // Turns that called the model at all (a guided flow alone calls none).
  int32 model_turns = 5;
  int64 input_tokens = 6;
  int64 output_tokens = 7;
  // An estimate: tokens times the configured price per million.
  double cost_usd = 8;
  // 0 when no turn in the range produced a token.
  double avg_first_token_ms = 9;
  double avg_total_ms = 10;
  int32 errors = 11;
  // RFC 3339.
  string last_active = 12;
}

message UsageReply {
  string from_date = 1;
  string to_date = 2;
  string provider = 3;
  string model = 4;
  double price_input_per_mtok = 5;
  double price_output_per_mtok = 6;
  repeated UserUsage users = 7;
  UserUsage totals = 8;
  // Generated communication (PART-B-FR-5): drafts written, sent (or saved into a note),
  // discarded, and how many patients the sent ones reached.
  int32 drafts_generated = 9;
  int32 drafts_sent = 10;
  int32 drafts_discarded = 11;
  int32 draft_recipients = 12;
}

message StartReportRequest {
  // "operations_7" (weekly) or "operations_30" (monthly).
  string kind = 1;
  // Optional inclusive dates, YYYY-MM-DD; default: the period ending today.
  string from_date = 2;
  string to_date = 3;
}

message ReportJob {
  string report_id = 1;
  string title = 2;
  // running | done | failed
  string status = 3;
  string from_date = 4;
  string to_date = 5;
  // RFC 3339.
  string created_at = 6;
}

message WatchReportRequest {
  string report_id = 1;
  int64 resume_from = 2;
}

message ListReportsRequest {
  int32 limit = 1;
}

message ListReportsReply {
  repeated ReportJob reports = 1;
}
