# The golden set: questions and the passages that should answer them (spec section 8.5).
#
# `expect` lists acceptable source ids; a question is a hit at k when any of them is in the
# top k. `expect: []` means nothing in the corpus is relevant and the right answer is an
# empty result -- the assistant then says it does not know. `audience` is the caller's.
# Phrased the way patients and staff actually ask: vague, with symptoms instead of
# specialties, and rarely in the corpus's own words.

- q: Who should I see for chest tightness when I climb stairs?
  audience: patient
  expect: [doc:specialties#cardiology, doc:urgent-care#chest-pain]
- q: I have a rash that keeps coming back, which doctor?
  audience: patient
  expect: [doc:specialties#dermatology]
- q: my thyroid might be underactive who treats that
  audience: patient
  expect: [doc:specialties#endocrinology, doc:prep-blood-tests#thyroid-function-test]
- q: constant heartburn and stomach pain
  audience: patient
  expect: [doc:specialties#gastroenterology]
- q: I keep getting bad migraines
  audience: patient
  expect: [doc:specialties#neurology]
- q: knee pain from arthritis
