[alembic]
script_location = migrations
prepend_sys_path = .
# `path_separator` covers prepend_sys_path and version paths; without it
# Alembic 1.19 warns and falls back to legacy splitting on spaces/commas/colons.
path_separator = os
version_path_separator = os
# sqlalchemy.url is set programmatically in migrations/env.py from application
# settings, so a DSN is never duplicated here.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
