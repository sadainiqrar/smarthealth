id: vst-010-only-the-treating-provider-acts-on-a-visit
title: "Only the appointment's own provider may mark its visit seen or complete, and completing needs a signed note"
requirement: [PART-A-FR-3, PART-A-FR-1.3]
tier: contract
priority: P0
status: ready
# Closes PRD R-14: seen and complete were gated by role alone, so any provider could act on
# any appointment. A provider who is not the appointment's gets 404 and nothing is written;
# a visit without a signed note answers 409 (the sibling
# test_a_visit_without_a_signed_note_cannot_complete). The integration round trip
# test_visit_round_trip.py signs a note through the API before completing.
impl: "tests/tiers/t1_contract/test_visits_contract.py::test_a_provider_who_is_not_the_appointments_gets_404_and_writes_nothing"
