id: vst-008-a-real-timer-marks-a-no-show
title: "On real Temporal and Postgres, an appointment nobody checks in for becomes no_show at the slot's end, its slot stays booked, and a late check-in is refused"
requirement: [PART-A-FR-3]
tier: integration
priority: P1
status: ready
# vst-002 proves the workflow's logic in the time-skipping environment; this proves the
# wiring on the real stack. A slot starting three seconds out and lasting one second is
# booked over HTTP with an in-process worker whose grace is zero. The booking starts the
# visit, a real timer fires at the slot's end, the real no_show activity marks the
# appointment under its lock, and the workflow returns "no_show". The slot stays
# `booked` (R-2), no visit row exists, and a check-in arriving afterwards is a 409.
impl: "tests/tiers/t3_integration/test_visit_round_trip.py::test_nobody_checking_in_becomes_a_no_show_on_the_real_timer"
