id: vst-004-visit-end-to-end
title: "A visit runs from booking to completion over HTTP: 200s with the written visit, state machine 409s, appointment completed, audit trail with the real actors"
requirement: [PART-A-FR-3]
tier: integration
priority: P1
status: ready
# Real infrastructure: a booking confirms and starts its visit timer; front desk checks
# in (200, visit checked_in, and the post-commit signal ends the timer "checked_in"), a
# provider marks seen and completes (200 each). A repeated check-in, an early complete
# and the wrong role are refused synchronously (409, 409, 403). The appointment reads
# `completed`, the slot stays `booked` (R-2), and Mongo holds checked_in, seen,
# completed in order, each with the token's user as actor. Runs in T3 with an
# in-process worker.
impl: "tests/tiers/t3_integration/test_visit_round_trip.py::test_a_visit_runs_from_booking_to_completion"
