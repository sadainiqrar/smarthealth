id: sys-008-every-workflow-is-registered-and-sandbox-safe
title: "Every Temporal workflow and activity in app/ is registered, and every registered workflow passes the sandbox"
requirement: [PART-A-NFR-2]
tier: unit
priority: P0
status: ready
# Traced to PART-A-NFR-2, "no corrupt scheduling state after partial failure". Temporal
# only delivers that guarantee for a workflow a worker actually runs and can replay:
#
# - An unregistered workflow is one no worker polls for. Its starts are accepted and
#   then sit in the task queue forever -- no error anywhere, just a booking that never
#   leaves `pending`. Nothing else in the suite would notice.
# - A workflow module that reads the clock or opens a socket at import fails Temporal's
#   sandbox validation, and replay after a worker crash is exactly where that bites.
#
# Discovery reads the source with `ast` rather than trusting the registry, because the
# definition the registry does not know about is the one being hunted. Sibling tests in
# the same file close the bypasses: activities are checked the same way, the `workflow`
# and `activity` namespaces may only be imported as `from temporalio import
# workflow|activity` (the spelling discovery matches; other temporalio imports are
# fine), Temporal type names must be unique, and each registered workflow is
# prepared inside the sandbox. `impl` names the registration test; the file runs whole
# in the fast lane, as sys-005's meta-test does.
#
# P0 because every Week 2 workflow lands through app/components.py, and this is the
# only check that a forgotten line there is a failure rather than a silent hang.
impl: "tests/meta/test_temporal_registry.py::test_every_workflow_definition_is_registered"
